<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- One of each shape kind the converter supports. Each row is one area of risk. -->
  <!-- Straight edges and sharp corners -->
  <rect x="10" y="10" width="80" height="50" stroke="#1f6feb" stroke-width="3" fill="none"/>
  <rect x="110" y="10" width="80" height="50" rx="10" stroke="#1f6feb" stroke-width="3" fill="none"/>
  <polyline points="210,60 230,10 250,60 270,10 290,60" stroke="#dc2626" stroke-width="2" fill="none"/>
  <path d="M310 35 h60 M362 27 l8 8 l-8 8" stroke="#475569" stroke-width="2.5" fill="none"/>
  <!-- Round shapes -->
  <circle cx="50" cy="110" r="30" stroke="#f59e0b" stroke-width="3" fill="none"/>
  <ellipse cx="150" cy="110" rx="40" ry="20" stroke="#f59e0b" stroke-width="3" fill="none"/>
  <!-- Curves and arcs -->
  <path d="M210 130 C 230 80, 270 140, 290 90" stroke="#16a34a" stroke-width="3" fill="none"/>
  <path d="M310 130 Q 340 70 370 130 T 395 130" stroke="#16a34a" stroke-width="2" fill="none"/>
  <path d="M20 200 A 40 25 0 0 1 100 200" stroke="#9333ea" stroke-width="3" fill="none"/>
  <!-- Transforms, fill-only shapes, units -->
  <g transform="translate(130 160) rotate(20)" stroke="#0ea5e9" stroke-width="3px" fill="none">
    <rect x="0" y="0" width="60" height="40"/>
  </g>
  <polygon points="250,160 290,230 210,230" fill="#db2777"/>
  <path d="M310 170 l40 0 l0 40 l-40 0 Z m10 10 l20 0 l0 20 l-20 0 Z" stroke="#334155" stroke-width="2" fill="none"/>
  <line x1="10" y1="280" x2="390" y2="280" stroke="#000" stroke-width="1"/>
</svg>
